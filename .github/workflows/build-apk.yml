name: Build WayLandIE APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'android-app/**'
      - 'deps/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw "Android SDK path was not found" }

          $sdkmanager = Join-Path $sdk "cmdline-tools\latest\bin\sdkmanager.bat"
          if (-not (Test-Path $sdkmanager)) {
            $sdkmanager = Join-Path $sdk "tools\bin\sdkmanager.bat"
          }
          if (-not (Test-Path $sdkmanager)) {
            throw "sdkmanager.bat was not found under $sdk"
          }

          & $sdkmanager --licenses
          & $sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865"

      - name: Locate NDK
        id: ndk
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          $ndk = Join-Path $sdk "ndk\29.0.14206865"
          if (-not (Test-Path (Join-Path $ndk "source.properties"))) {
            throw "NDK 29.0.14206865 was not installed"
          }
          "path=$ndk" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build native APK
        shell: pwsh
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.path }}
        run: |
          .\android-app\tools\build-apk.ps1 -NdkRoot "$env:NDK_ROOT" -RequireNative

      - name: Verify APK exists
        shell: pwsh
        run: |
          $apk = "android-app\out\waylandie-display-mvp.apk"
          if (-not (Test-Path $apk)) {
            throw "APK was not produced: $apk"
          }
          Get-Item $apk | Format-List FullName,Length,LastWriteTime

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WayLandIE-APK
          path: android-app/out/waylandie-display-mvp.apk
          if-no-files-found: error

      - name: Publish GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/out/waylandie-display-mvp.apk
          generate_release_notes: true
