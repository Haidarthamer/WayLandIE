name: Build WayLandIE APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android-app/**'
      - 'deps/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw "Android SDK path was not found" }

          $sdkmanager = Get-ChildItem (Join-Path $sdk "cmdline-tools") -Filter sdkmanager.bat -Recurse -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $sdkmanager) {
            $sdkmanager = Get-ChildItem (Join-Path $sdk "tools") -Filter sdkmanager.bat -Recurse -ErrorAction SilentlyContinue |
              Select-Object -First 1
          }
          if (-not $sdkmanager) { throw "sdkmanager.bat was not found" }

          & $sdkmanager.FullName --licenses
          & $sdkmanager.FullName "platforms;android-36" "build-tools;35.0.1" "ndk;29.0.14206865"
          if ($LASTEXITCODE -ne 0) { throw "Android SDK installation failed" }

      - name: Configure Android Build Tools
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }

          $aapt2 = Get-ChildItem (Join-Path $sdk "build-tools") -Filter aapt2.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1

          if (-not $aapt2) { throw "aapt2.exe was not found" }

          $bt = Split-Path $aapt2.FullName -Parent
          "ANDROID_BUILD_TOOLS=$bt" | Out-File $env:GITHUB_ENV -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File $env:GITHUB_ENV -Append

          Write-Host "Using: $aapt2"
          & $aapt2.FullName version

      - name: Locate NDK
        id: ndk
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { $sdk = $env:ANDROID_SDK_ROOT }
          $ndk = Join-Path $sdk "ndk\29.0.14206865"
          if (-not (Test-Path (Join-Path $ndk "source.properties"))) {
            throw "NDK 29.0.14206865 was not installed"
          }
          "path=$ndk" | Out-File $env:GITHUB_OUTPUT -Append

      - name: Build native APK
        shell: pwsh
        env:
          NDK_ROOT: ${{ steps.ndk.outputs.path }}
        run: |
          .\android-app\tools\build-apk.ps1 -NdkRoot "$env:NDK_ROOT" -RequireNative

      - name: Verify APK
        shell: pwsh
        run: |
          $apk = "android-app\out\waylandie-display-mvp.apk"
          if (-not (Test-Path $apk)) { throw "APK was not produced: $apk" }
          Get-Item $apk | Format-List FullName,Length,LastWriteTime

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WayLandIE-APK
          path: android-app/out/waylandie-display-mvp.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/out/waylandie-display-mvp.apk
          generate_release_notes: true
